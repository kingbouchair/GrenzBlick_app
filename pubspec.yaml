name: grenzblick
description: GrenzBlick – Preise, Tanken und Zollinfos an der Grenze.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  http: ^1.2.0
  shared_preferences: ^2.2.2
  supabase_flutter: ^2.3.0
  url_launcher: ^6.2.5  # <--- NEU HINZUGEFÜGT

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/logo_banner.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
